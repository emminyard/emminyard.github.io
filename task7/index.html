<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="slider">
        <button class="slider-arrow prev" id="prev-btn" aria-label="Назад">&#10094;</button>
        
        <div class="slider-window">
            <div class="slider-track" id="track">
                <div class="slide"><img src="1.jpg" alt="Фото 1"></div>
                <div class="slide"><img src="2.jpg" alt="Фото 2"></div>
                <div class="slide"><img src="3.jpg" alt="Фото 3"></div>
                <div class="slide"><img src="4.jpg" alt="Фото 4"></div>
                <div class="slide"><img src="5.jpg" alt="Фото 5"></div>
                <div class="slide"><img src="6.jpg" alt="Фото 6"></div>
                <div class="slide"><img src="7.jpg" alt="Фото 7"></div>
                <div class="slide"><img src="8.jpg" alt="Фото 8"></div>
                <div class="slide"><img src="9.jpg" alt="Фото 9"></div>
            </div>
        </div>

        <button class="slider-arrow next" id="next-btn" aria-label="Вперёд">&#10095;</button>
    </div>

    <div class="pager" id="pager"></div>

</body>
</html>
